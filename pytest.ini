[pytest]
testpaths = tests
# Stops pytest from creating a .pytest_cache folder. That folder caused
# permission errors on Windows.
# --headed opens a visible browser. Without it the site blocks the home page.
# The last three options save a screenshot and a trace when a test fails.
addopts = -p no:cacheprovider --headed --screenshot=only-on-failure --tracing=retain-on-failure --output=test-results
markers =
    e2e: end-to-end tests on the live Avianca site (challenge Tests 2 and 4)
