[pytest]
testpaths = tests
# Stops pytest from creating a .pytest_cache folder. That folder caused
# permission errors on Windows.
# The last three options save a screenshot and a trace when a test fails.
addopts = -p no:cacheprovider --screenshot=only-on-failure --tracing=retain-on-failure --output=test-results
markers =
    e2e: end-to-end test on the live Avianca site (challenge Test 4)
